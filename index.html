<body style="background-color: #05000a; background-image: radial-gradient(circle at 50% 50%, #1a001a 0%, #000000 100%); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'OLD ENGLISH TEXT', 'Times New Roman', serif; overflow: hidden;">

    <style>
        :root {
            --magenta-neon: #ff00d4;
            --magenta-oscuro: #80006a;
            --oro-bdh: #FFD700;
            --fondo-panel: rgba(10, 0, 15, 0.85);
            --borde-resplandor: rgba(255, 0, 212, 0.4);
        }

        .contenedor-maestro {
            width: 400px;
            background: var(--fondo-panel);
            border: 2px solid var(--magenta-oscuro);
            border-radius: 15px;
            box-shadow: 0 0 30px var(--borde-resplandor), inset 0 0 20px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 30px;
            box-sizing: border-box;
        }

        .marca-titulo {
            color: var(--oro-bdh);
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 2px 2px 5px #000, 0 0 15px var(--magenta-neon);
            letter-spacing: 2px;
        }

        .marca-subtitulo {
            color: var(--magenta-neon);
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-family: sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
        }

        .botones-oauth {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Enlaces nativos que funcionan como botones. Cero JavaScript */
        .btn-google, .btn-outlook {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--magenta-oscuro);
            color: var(--oro-bdh);
            padding: 15px;
            font-size: 1.1rem;
            font-family: sans-serif;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-google:hover, .btn-outlook:hover {
            border-color: var(--magenta-neon);
            box-shadow: 0 0 15px rgba(255, 0, 212, 0.3);
            background: linear-gradient(90deg, #000, var(--magenta-oscuro));
            color: #fff;
        }

        .btn-icon {
            font-size: 1.5rem;
            margin-right: 15px;
        }
    </style>

    <div class="contenedor-maestro">
        <h1 class="marca-titulo">UNIVERSO BDH</h1>
        <h2 class="marca-subtitulo">Acceso Blazar</h2>
        
        <div class="botones-oauth">
            <!-- Redirige a su servidor Python para iniciar el flujo con Google -->
            <a href="https://auth.galaxymanager.system/auth/google/login" class="btn-google">
    <span class="btn-icon">G</span> Continuar con Google
</a> </a>

            <!-- Redirige a su servidor Python para iniciar el flujo con Outlook -->
            <a href="/api/auth/outlook" class="btn-outlook">
                <span class="btn-icon">✉</span> Continuar con Outlook
            </a>
        </div>
    </div>

</body>
